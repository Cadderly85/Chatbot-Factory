# ═══════════════════════════════════════════════════════════════════════════════
# Chatbot Factory — GitHub Actions : Déploiement Automatique
# ═══════════════════════════════════════════════════════════════════════════════
#
# Fichier à placer dans le repo du client :
#   .github/workflows/deploy.yml
#
# Variables à configurer dans GitHub → Settings → Secrets and variables → Actions :
#   RENDER_API_KEY     → Clé API Render (sur render.com → Account Settings → API Keys)
#   RENDER_SERVICE_ID  → ID du service Render (dans l'URL du dashboard Render)
#
# ═══════════════════════════════════════════════════════════════════════════════

name: 🚀 Déploiement Automatique Chatbot Factory

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permet de déclencher manuellement depuis GitHub

jobs:
  # ─── Job 1 : Tests ──────────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 Construction de la base de connaissances
        run: python build_knowledge_base.py

      - name: 🧪 Exécution des tests
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 || true
          # Si pas de tests pytest, on fait un test de santé basique
          python -c "
          import sys
          sys.path.insert(0, '.')
          from agent import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          resp = client.get('/health')
          print(f'Health check: {resp.status_code} - {resp.json()}')
          assert resp.status_code == 200, 'Health check failed!'
          print('✅ Tests passés')
          "

  # ─── Job 2 : Déploiement sur Render ─────────────────────────────────────
  deploy:
    name: 🚀 Déploiement Render
    runs-on: ubuntu-latest
    needs: test  # Ne déploie que si les tests passent

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🚀 Déclencher le déploiement Render
        run: |
          echo "🚀 Déploiement sur Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Déploiement déclenché avec succès!"
          else
            echo "❌ Erreur de déploiement (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: ⏳ Attendre que le déploiement soit prêt
        run: |
          echo "⏳ Attente du déploiement (max 5 minutes)..."
          sleep 30

          for i in $(seq 1 10); do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | \
              python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('service', {}).get('suspended', 'unknown'))" 2>/dev/null)

            echo "  Vérification $i/10 — Status: $STATUS"

            if [ "$STATUS" = "False" ] || [ "$STATUS" = "false" ]; then
              echo "✅ Service actif!"
              break
            fi

            sleep 30
          done

      - name: 🏥 Health check post-déploiement
        run: |
          echo "🏥 Vérification de l'agent..."
          AGENT_URL="${{ vars.AGENT_URL }}"

          if [ -z "$AGENT_URL" ]; then
            echo "⚠️ AGENT_URL non configuré dans les variables GitHub — health check ignoré"
            exit 0
          fi

          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$AGENT_URL/health" --max-time 10)
            echo "  Tentative $i/5 — HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Agent en ligne et fonctionnel!"
              curl -s "$AGENT_URL/health" | python3 -m json.tool
              exit 0
            fi

            sleep 15
          done

          echo "⚠️ L'agent ne répond pas après 5 tentatives. Vérifiez manuellement."
          exit 1

  # ─── Job 3 : Notification ───────────────────────────────────────────────
  notify:
    name: 📧 Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: 📧 Notification Discord (optionnel)
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ needs.deploy.result }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            MESSAGE="Déploiement réussi pour ${{ github.repository }}"
            COLOR="3066993"  # Vert
          else
            EMOJI="❌"
            MESSAGE="Échec du déploiement pour ${{ github.repository }}"
            COLOR="15158332"  # Rouge
          fi

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$EMOJI Chatbot Factory — Déploiement\",
                \"description\": \"$MESSAGE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\", \"inline\": true},
                  {\"name\": \"Auteur\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"Branche\", \"value\": \"${{ github.ref_name }}\", \"inline\": true}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"

      - name: 📧 Notification Slack (optionnel)
        if: env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          STATUS="${{ needs.deploy.result }}"
          if [ "$STATUS" = "success" ]; then
            TEXT="✅ *Chatbot Factory* — Déploiement réussi pour ${{ github.repository }}"
          else
            TEXT="❌ *Chatbot Factory* — Échec du déploiement pour ${{ github.repository }}"
          fi

          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$TEXT\"}"
